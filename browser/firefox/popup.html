<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/32.png" alt=""><span>Mec Encoder</span></header>

  <section id="src" class="src">
    <div class="src-label" id="srcLabel"></div>
    <div class="src-url" id="srcUrl"></div>
  </section>

  <button id="bQuick" class="btn primary" data-kind="video">
    <span><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><b data-i18n="btnQuick"></b></span>
    <small data-i18n="btnQuickSub"></small>
  </button>
  <div class="row">
    <button class="btn" data-kind="audio"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span data-i18n="btnAudio"></span></button>
    <button class="btn" data-kind="gif"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h-1.5a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1H8v-2M11 10v4M14 14v-4h3M14 12h2"/></svg><span>GIF</span></button>
  </div>
  <button class="btn ghost" data-kind="pick">
    <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    <span data-i18n="btnPick"></span><small data-i18n="btnPickSub"></small>
  </button>

  <button id="swap" class="swap" hidden></button>

  <label class="toggle">
    <span><b data-i18n="floatToggle"></b><small id="floatHint" data-i18n="floatSub"></small></span>
    <input type="checkbox" id="float"><i></i>
  </label>
  <div id="msg" class="msg" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
