<!doctype html>
<html lang="pt-BR" data-theme="studio" data-variant="2">
<head>
<meta charset="utf-8">
<title>Mec Encoder · Baixar (rascunho)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="v2.css">
<link rel="stylesheet" href="studio.css">
<style>
/* Rascunho da aba Baixar. Mesmo sistema do app (tema Estúdio): cromo grafite, um acento azul,
   a cor fica nas miniaturas. Assinatura: números técnicos em mono e teclas como keycaps. */
body{margin:0;height:100vh;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}
.tabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:var(--fill);border-radius:9px;padding:2px}
.tabs button{position:relative;z-index:1;height:26px;padding:0 16px;font-size:12px;font-weight:500;color:var(--text-2);border-radius:7px;transition:color .16s var(--ease),background .16s var(--ease)}
.tabs button.on{background:var(--seg-pill);color:var(--text)}

.dlv{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr)}
.dk-side{border-right:1px solid var(--sep);display:flex;flex-direction:column;min-height:0;overflow:auto}
.dk-blk{padding:16px}
.dk-blk+.dk-blk{border-top:1px solid var(--sep)}
.dk-cap{font-size:12px;color:var(--text-3);margin:0 0 8px}
.dk-btn{width:100%;height:44px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;font-size:13.5px;font-weight:500;
  transition:background .16s var(--ease),transform .12s var(--ease)}
.dk-btn:active{transform:scale(.985)}
.dk-btn svg{width:17px;height:17px;flex:none}
.dk-btn .dk-keys{margin-left:auto;display:flex;gap:4px}
.dk-btn.dk-pri{background:var(--blue);color:#fff}
.dk-btn.dk-pri:hover{background:color-mix(in srgb,var(--blue) 88%,#fff)}
.dk-btn.dk-sec{background:var(--fill);color:var(--text);margin-top:8px}
.dk-btn.dk-sec:hover{background:var(--fill-2)}
kbd{display:inline-block;min-width:18px;padding:0 5px;border-radius:4px;font:500 10.5px/18px var(--font);text-align:center;
  background:var(--fill);border:1px solid var(--stroke-2);color:var(--text-2)}
.dk-btn.dk-pri kbd{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);color:#fff}
.dk-clip{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);min-width:0}
.dk-clip svg{width:14px;height:14px;flex:none}
.dk-clip span{white-space:nowrap;flex:none}
.dk-clip code{font:400 11.5px var(--mono);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

textarea{width:100%;box-sizing:border-box;height:96px;resize:none;border-radius:10px;background:var(--stage);border:1px solid var(--stroke-2);
  color:var(--text);font:400 12px/20px var(--mono);padding:8px 10px}
textarea::placeholder{color:var(--text-3);font-family:var(--font)}
.dk-multi{display:flex;align-items:center;gap:8px;margin-top:8px}
.dk-multi .seg{grid-auto-columns:auto}
.dk-multi .seg button{height:28px;padding:0 12px}
.dk-multi .dk-go{margin-left:auto;height:32px;padding:0 14px;border-radius:9px;background:var(--fill);color:var(--text);font-size:12.5px;font-weight:500}
.dk-multi .dk-go:hover{background:var(--fill-2)}
.seg .pill{transition:none}

.dk-set .row{padding:6px 0;min-height:44px}
.dk-set .row+.row::before{left:0}
.dk-set .lbl small{line-height:15px;margin-top:2px}
.dk-path{display:flex;align-items:center;gap:8px;min-width:0}
.dk-path code{font:400 11.5px var(--mono);color:var(--text-2);white-space:nowrap}
.dk-path button{font-size:12px;color:var(--blue)}
.dk-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--sep);font:400 11px var(--mono);color:var(--text-3);display:flex;gap:8px}
.dk-foot i{width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.8;align-self:center;font-style:normal}

/* lista */
.dk-list{background:var(--canvas);display:flex;flex-direction:column;min-height:0}
.dk-lhead{display:flex;align-items:center;gap:10px;padding:14px 20px 10px}
.dk-lhead h2{font-size:14px;font-weight:600;margin:0}
.dk-lhead .dk-n{font:400 12px var(--mono);color:var(--text-3)}
.dk-lhead .link{margin-left:auto;margin-right:-2px;font-size:12px;color:var(--text-3)}
.dk-lhead .link:hover{color:var(--text)}
.dk-lhead .link+.dk-ghost{margin-left:0}
.dk-ghost{margin-left:auto;height:30px;padding:0 12px 0 10px;border-radius:8px;background:var(--fill);color:var(--text);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.dk-ghost svg{width:14px;height:14px;color:var(--text-2)}
.dk-rows{padding:0 12px 12px;overflow:auto}
.dk-row{display:grid;grid-template-columns:64px minmax(0,1fr) 248px;align-items:center;gap:16px;padding:8px;border-radius:12px;min-height:72px}
.dk-row{position:relative}
.dk-row+.dk-row::before{content:"";position:absolute;left:88px;right:8px;top:0;height:1px;background:var(--sep)}
.dk-row:hover::before,.dk-row:hover+.dk-row::before{opacity:0}
.dk-row:hover{background:var(--hover)}
.dk-th{width:64px;height:64px;display:grid;place-items:center}
.dk-th svg.scene,.dk-th .dk-au{border-radius:7px;display:block;overflow:hidden}
.dk-th.v svg.scene{width:36px;height:64px}
.dk-th.h svg.scene{width:64px;height:36px}
.dk-th .dk-au{width:64px;height:64px;background:var(--fill);display:grid;place-items:center;color:var(--text-2)}
.dk-th .dk-au svg{width:22px;height:22px}
.dk-th .dk-ph{width:36px;height:64px;border-radius:7px;background:var(--fill);display:grid;place-items:center;color:var(--text-3)}
.dk-th .dk-ph svg{width:16px;height:16px}
.dk-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.dk-ttl{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-meta{font:400 11px var(--mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-meta b{font-weight:400;color:var(--text-2);font-family:var(--font);font-size:11.5px}
.dk-st{display:flex;flex-direction:column;gap:6px;min-width:0}
.dk-st-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.dk-st-top .dk-pct{margin-left:auto;font:500 12px var(--mono);color:var(--text)}
.dk-bar{height:3px;border-radius:2px;background:var(--fill-2);overflow:hidden}
.dk-bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.dk-bar.dk-web i{background:var(--text-2)}
.dk-st-sub{font:400 11px var(--mono);color:var(--text-3)}
.dk-done{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.dk-done .dk-ok{width:16px;height:16px;color:var(--green)}
.dk-done .dk-sz{font:400 11.5px var(--mono);color:var(--text-3)}
.dk-acts{margin-left:auto;display:flex;gap:2px}
.dk-ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
.dk-ib:hover{background:var(--fill);color:var(--text)}
.dk-ib svg{width:15px;height:15px}
.dk-err{font-size:12px;color:color-mix(in srgb,var(--red) 82%,var(--text))}
.dk-err-row{display:flex;align-items:center;gap:8px}
.dk-err-row button{margin-left:auto;font-size:12px;color:var(--text-2)}
.dk-err-row button:hover{color:var(--text)}
.wait{font-size:12px;color:var(--text-3)}

/* vazio */
.dk-empty{flex:1;display:grid;place-items:center;text-align:center}
.dk-empty div{display:grid;gap:10px;justify-items:center;max-width:360px}
.dk-empty svg{width:28px;height:28px;color:var(--text-3)}
.dk-empty b{font-size:14px;font-weight:500}
.dk-empty span{font-size:12.5px;color:var(--text-3);line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="drag"></div>
    <button class="tb-title"><span class="logo"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M2.5 1.6v6.8L8.6 5z"/></svg></span>Mec Encoder
      <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5L6 7l2.5-2.5"/></svg></button>
    <div class="tabs"><button>Converter</button><button class="on">Baixar</button></div>
    <div class="tb-actions"><span class="tb-sep"></span>
      <div class="win"><button><svg viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="w-close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button></div>
    </div>
  </div>

  <div class="dlv">
    <aside class="dk-side">
      <div class="dk-blk">
        <p class="dk-cap">Baixa o link do Ctrl+C na hora, na maior qualidade</p>
        <button class="dk-btn dk-pri"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg>Baixar vídeo<span class="dk-keys"><kbd>Ctrl</kbd><kbd>V</kbd></span></button>
        <button class="dk-btn dk-sec"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12V3.5l7-1.5V10.5"/><circle cx="4.2" cy="12" r="1.8"/><circle cx="11.2" cy="10.5" r="1.8"/></svg>Baixar áudio<span class="dk-keys"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>V</kbd></span></button>
        <div class="dk-clip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3.5" y="2.5" width="9" height="11.5" rx="2"/><path d="M6 2.5h4v2H6z"/></svg>
          <span>No Ctrl+C</span><code>tiktok.com/@frankiebruno/video/74318…</code></div>
      </div>

      <div class="dk-blk">
        <p class="dk-cap">Vários links, um por linha</p>
        <textarea placeholder="Cole os links aqui">youtube.com/shorts/Qx81kLm2aZc
x.com/streetq/status/18560432917
instagram.com/reel/DB7xQwPtL4e</textarea>
        <div class="dk-multi">
          <div class="seg"><i class="pill" style="left:2px;width:62px"></i><button class="active">Vídeo</button><button>Áudio</button></div>
          <button class="dk-go">Baixar 3 links</button>
        </div>
      </div>

      <div class="dk-blk dk-set">
        <div class="row"><div class="lbl">Pronto para web<small>H.264 + AAC em .mp4. Abre no WhatsApp, Instagram e navegador</small></div><span class="switch on"></span></div>
        <div class="row"><div class="lbl">Áudio sai em</div>
          <div class="seg"><i class="pill" style="left:2px;width:44px"></i><button class="active">WAV</button><button>M4A</button><button>MP3</button><button>FLAC</button></div></div>
        <div class="row"><div class="lbl">Salvar em</div><div class="dk-path"><code>Downloads\Mec Encoder</code><button>Alterar</button></div></div>
      </div>

      <div class="dk-foot"><i></i>yt-dlp 2026.11.03 · atualizado hoje</div>
    </aside>

    <section class="dk-list" id="list">
      <div class="dk-lhead"><h2>Downloads</h2><span class="dk-n">5</span><button class="link">Limpar concluídos</button>
        <button class="dk-ghost"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4.8A1.8 1.8 0 0 1 3.8 3h2.6l1.5 1.5h4.3A1.8 1.8 0 0 1 14 6.3v5A1.8 1.8 0 0 1 12.2 13H3.8A1.8 1.8 0 0 1 2 11.2z"/></svg>Abrir pasta</button></div>
      <div class="dk-rows" id="rows"></div>
    </section>
  </div>
</div>
<script>
function scene(hue, vertical) {
  const W = vertical ? 90 : 160, H = vertical ? 160 : 90, g = 'g' + hue + (vertical ? 'v' : 'h');
  const bl = []; let x = -4; let i = 0;
  while (x < W) { const bw = W * (.07 + ((i * 37) % 9) / 100); const bh = H * (.10 + ((i * 53) % 19) / 100);
    bl.push(`<rect x="${x}" y="${H * .74 - bh}" width="${bw}" height="${bh + 2}" rx="1"/>`); x += bw + 1.5; i++; }
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(${hue + 200},55%,30%)"/><stop offset=".55" stop-color="hsl(${hue},75%,62%)"/><stop offset="1" stop-color="hsl(${hue + 20},80%,72%)"/></linearGradient>
      <radialGradient id="${g}s"><stop offset="0" stop-color="#fff8e6"/><stop offset=".35" stop-color="hsl(${hue + 25},95%,75%)" stop-opacity=".9"/><stop offset="1" stop-color="hsl(${hue + 25},95%,70%)" stop-opacity="0"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${g})"/>
    <circle cx="${W * .62}" cy="${H * .56}" r="${W * .32}" fill="url(#${g}s)"/>
    <g fill="hsl(${hue + 210},35%,14%)" opacity=".92">${bl.join('')}</g>
    <rect y="${H * .74}" width="${W}" height="${H * .26}" fill="hsl(${hue + 210},25%,10%)"/>
  </svg>`;
}
const I = {
  folder: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4.8A1.8 1.8 0 0 1 3.8 3h2.6l1.5 1.5h4.3A1.8 1.8 0 0 1 14 6.3v5A1.8 1.8 0 0 1 12.2 13H3.8A1.8 1.8 0 0 1 2 11.2z"/></svg>',
  x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
  queue: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l6 3.3-6 3.3-6-3.3z"/><path d="M2 8.7l6 3.3 6-3.3"/></svg>',
  ok: '<svg class="dk-ok" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  note: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12V3.5l7-1.5V10.5"/><circle cx="4.2" cy="12" r="1.8"/><circle cx="11.2" cy="10.5" r="1.8"/></svg>',
  lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3.5" y="7" width="9" height="6.5" rx="1.6"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></svg>',
};
const rows = [
  { th: scene(20, true), v: 1, t: 'Honesty Drop with Porsche', m: '<b>TikTok</b> · 1080×1920 · 60 fps · 0:42',
    st: `<div class="dk-st-top">Baixando<span class="dk-pct">62%</span></div><div class="dk-bar"><i style="width:62%"></i></div><div class="dk-st-sub">18,4 de 29,6 MB · 8,2 MB/s · 0:02</div>`, x: 1 },
  { th: scene(210, false), v: 0, t: 'How I edit street interviews in Premiere Pro', m: '<b>YouTube</b> · 3840×2160 · 30 fps · 12:08 · VP9',
    st: `<div class="dk-st-top">Preparando para web<span class="dk-pct">38%</span></div><div class="dk-bar dk-web"><i style="width:38%"></i></div><div class="dk-st-sub">VP9 → H.264 · NVENC · 6,1×</div>`, x: 1 },
  { th: scene(330, true), v: 1, t: 'Asked strangers for a hug in Times Square', m: '<b>X</b> · 720×1280 · 30 fps · 0:58',
    st: `<div class="dk-done">${I.ok}Pronto<span class="dk-sz">14,2 MB</span><span class="dk-acts"><button class="dk-ib" title="Mandar para a fila do conversor">${I.queue}</button><button class="dk-ib" title="Mostrar na pasta">${I.folder}</button></span></div>` },
  { th: `<span class="dk-au">${I.note}</span>`, v: 2, t: 'Midnight Drive · lo-fi beat, no copyright', m: '<b>YouTube</b> · WAV 48 kHz 24-bit · 3:12',
    st: `<div class="dk-done">${I.ok}Pronto<span class="dk-sz">55,3 MB</span><span class="dk-acts"><button class="dk-ib" title="Mostrar na pasta">${I.folder}</button></span></div>` },
  { th: `<span class="dk-ph">${I.lock}</span>`, v: 1, t: 'instagram.com/reel/DB7xQwPtL4e', m: '<b>Instagram</b>',
    st: `<div class="dk-err-row"><span class="dk-err">Este post precisa de login</span><button>Tentar de novo</button></div>` },
];
const empty = new URLSearchParams(location.search).has('empty');
if (empty) {
  document.querySelector('.dk-lhead .dk-n').textContent = ''; document.querySelector('.dk-lhead .link').remove();
  document.querySelector('textarea').value = ''; const g = document.querySelector('.dk-go'); g.textContent = 'Baixar'; g.disabled = true; g.style.opacity = '.4';
  document.getElementById('rows').outerHTML = `<div class="dk-empty"><div>${I.folder.replace('<svg', '<svg')}<b>Nenhum download ainda</b>
    <span>Copie o link de um vídeo do YouTube, TikTok, X ou outro site e clique em Baixar vídeo, ou aperte <kbd>Ctrl</kbd> <kbd>V</kbd> aqui</span></div></div>`;
} else {
  document.getElementById('rows').innerHTML = rows.map((r) => `<div class="dk-row"><div class="dk-th ${r.v === 1 ? 'v' : r.v === 0 ? 'h' : ''}">${r.th}</div>
    <div class="dk-info"><div class="dk-ttl">${r.t}</div><div class="dk-meta">${r.m}</div></div><div class="dk-st">${r.st}</div></div>`).join('');
}
</script>
</body>
</html>
