<!doctype html>
<html lang="en" data-theme="dark" data-variant="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mec Encoder</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="v2.css">
</head>
<body>
<div class="app" id="app">

  <!-- barra de título (controles no padrão do Windows, à direita) -->
  <div class="titlebar">
    <div class="drag" data-tauri-drag-region></div>
    <button class="tb-title" id="bAppMenu">
      <span class="logo"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M2.5 1.6v6.8L8.6 5z"/></svg></span>
      Mec Encoder
      <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5L6 7l2.5-2.5"/></svg>
    </button>
    <div class="tb-actions">
      <button class="update-pill" id="bUpdate" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg><span></span></button>
<span class="tb-sep"></span>
      <div class="win">
        <button class="w-min" id="bMin"><svg viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button class="w-max" id="bMax"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="w-close" id="bClose"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="main">

    <!-- FILA -->
    <section class="card" id="queueCard">
      <div class="card-head"><h2 id="lQueue"></h2><span class="count" id="qCount"></span>
        <button class="link" id="bClearDone"></button>
        <button class="add-btn" id="bSetAll" data-menu="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
        <button class="add-btn" id="bAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="all-drop" id="allDrop"><div class="all-drop-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span id="lDropAll"></span></div></div>
      <div class="queue smooth" id="queue"><div class="sc" id="qList"></div></div>
      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M12 10.5v6M9.5 13l2.5-2.5 2.5 2.5"/></svg>
        <div class="drop-t"><b id="lDropTitle"></b><span id="lDropSub"></span></div>
      </div>
      <div class="out-panel" id="outPanel"></div>
      <div class="queue-foot">
        <div class="totals"><span id="tTotal"></span><span id="tEta">NVENC · RTX</span></div>
        <button class="btn" id="bRender"><i class="fillbar" id="renderFill"></i>
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.6v10.8c0 .5.6.8 1 .5l8.3-5.4a.6.6 0 0 0 0-1L5 2.1c-.4-.3-1 0-1 .5z"/></svg>
          <span id="renderTxt"></span></button>
      </div>
    </section>

    <!-- PRÉVIA -->
    <section class="card preview" id="previewCard">
      <div class="pv-top">
        <div class="chips" id="chips"></div>
        <button class="cmp-btn" id="bCompare"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.8" y="3" width="12.4" height="10" rx="2"/><path d="M8 1.5v13"/><path d="M8 3h4.2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8z" fill="currentColor" stroke="none" opacity=".35"/></svg><span id="lCompare"></span></button>
      </div>
      <div class="stage"><div class="frame" id="frameIn" data-label=""></div><div class="frame" id="frame" data-label=""></div>
        <div class="pv-empty" id="pvEmpty">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="5" width="22" height="38" rx="5"/><path d="M21 20.5v7l6-3.5z" fill="currentColor"/></svg>
          <span id="lPvEmpty"></span>
        </div>
      </div>
      <div class="pv-meta" id="pvMeta"></div>
      <div class="transport">
        <div class="timeline" id="timeline"><div class="played"></div><canvas id="wave"></canvas><div class="head"></div></div>
        <div class="controls">
          <span class="tc tnum" id="tcNow">00:00:00:00</span>
          <div class="mid">
            <button class="ctl" title="←"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
            <button class="ctl"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M7.6 3.4v9.2L1.8 8zM14.2 3.4v9.2L8.4 8z"/></svg></button>
            <button class="ctl play" id="bPlay"><svg viewBox="0 0 16 16" fill="currentColor" id="playIco"><path d="M4.5 2.6v10.8c0 .5.6.8 1 .5l8-5.4a.6.6 0 0 0 0-1l-8-5.4c-.4-.3-1 0-1 .5z"/></svg></button>
            <button class="ctl"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.8 3.4v9.2L7.6 8zM8.4 3.4v9.2L14.2 8z"/></svg></button>
            <button class="ctl" title="→"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
          </div>
          <span class="tc end tnum" id="tcEnd">00:00:00:00</span>
        </div>
      </div>
    </section>

    <!-- INSPETOR -->
    <section class="card" id="inspector">
      <div class="card-head"><button class="fold-btn" id="bFoldPresets"><h2 id="lPresets"></h2><svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5L6 7l2.5-2.5"/></svg></button><button class="link" id="bManage"></button></div>
      <div class="fold" id="presetsFold"><div class="fold-in">
        <div class="presets" id="presets"></div>
        <div class="preset-desc" id="presetDesc"></div>
      </div></div>
      <div class="insp-title"><h3 id="inspFor"></h3><span class="modified" id="modified"><i></i><span id="lModified"></span></span><button class="link discard" id="bDiscard"></button><button class="link" id="bSavePreset"></button></div>
      <div class="inspector-body smooth" id="insp"><div class="sc" id="inspIn"></div></div>
      <div class="insp-foot">
        <div class="est" id="estBox"><small id="lEst"></small><b class="tnum" id="est"></b></div>
        <button class="btn small ghost" id="bApplyAll"></button>
      </div>
    </section>
  </div>
</div>

<!-- configurações -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog">
  <div class="sheet-head"><h2 id="lSettings"></h2><button class="sheet-done" id="bDone"></button></div>
  <div class="sheet-body smooth" id="sheetScroll"><div class="sc" id="sheetBody"></div></div>
</div>

<div class="menu" id="menu"></div>
<div class="drag-ghost" id="ghost"></div>
<div class="toast" id="toast"><i></i><span id="toastTxt"></span></div>
<audio id="sfxDone" src="sounds/done.mp3" preload="auto"></audio>

<script src="i18n.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
