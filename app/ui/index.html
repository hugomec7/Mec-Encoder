<!doctype html>
<html lang="en" data-theme="dark" data-variant="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mec Encoder</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="v2.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="app" id="app">

  <!-- barra de título (controles no padrão do Windows, à direita) -->
  <div class="titlebar">
    <div class="drag" data-tauri-drag-region></div>
    <button class="tb-title" id="bAppMenu">
      <span class="logo"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M2.5 1.6v6.8L8.6 5z"/></svg></span>
      Mec Encoder
      <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5L6 7l2.5-2.5"/></svg>
    </button>
    <div class="tabs" id="tabs"><button data-view="conv" id="tConv"></button><button data-view="cut" id="tCut"></button><button data-view="dl" id="tDl"></button></div>
    <div class="tb-actions">
      <button class="update-pill" id="bUpdate" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg><span></span></button>
<span class="tb-sep"></span>
      <div class="win">
        <button class="w-min" id="bMin"><svg viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button class="w-max" id="bMax"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button class="w-close" id="bClose"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <div class="main">

    <!-- FILA -->
    <section class="card" id="queueCard">
      <div class="card-head"><h2 id="lQueue"></h2><span class="count" id="qCount"></span>
        <button class="link" id="bClearDone"></button>
        <button class="add-btn" id="bSetAll" data-menu="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
        <button class="add-btn" id="bAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="all-drop" id="allDrop"><div class="all-drop-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span id="lDropAll"></span></div></div>
      <div class="queue smooth" id="queue"><div class="sc" id="qList"></div></div>
      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M12 10.5v6M9.5 13l2.5-2.5 2.5 2.5"/></svg>
        <div class="drop-t"><b id="lDropTitle"></b><span id="lDropSub"></span></div>
      </div>
      <div class="out-panel" id="outPanel"></div>
      <div class="queue-foot">
        <div class="totals"><span id="tTotal"></span><button class="after-btn" id="bAfter" data-menu="1"></button><span id="tEta">NVENC · RTX</span></div>
        <button class="btn" id="bRender"><i class="fillbar" id="renderFill"></i>
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.6v10.8c0 .5.6.8 1 .5l8.3-5.4a.6.6 0 0 0 0-1L5 2.1c-.4-.3-1 0-1 .5z"/></svg>
          <span id="renderTxt"></span></button>
      </div>
    </section>

    <!-- PRÉVIA -->
    <section class="card preview" id="previewCard">
      <div class="pv-top">
        <div class="chips" id="chips"></div>
        <button class="cmp-btn" id="bCompare"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.8" y="3" width="12.4" height="10" rx="2"/><path d="M8 1.5v13"/><path d="M8 3h4.2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8z" fill="currentColor" stroke="none" opacity=".35"/></svg><span id="lCompare"></span></button>
      </div>
      <div class="stage"><div class="frame" id="frameIn" data-label=""></div><div class="frame" id="frame" data-label=""></div><div class="pv-stat" id="pvStat" hidden></div>
        <div class="play-badge tnum" id="playBadge" hidden></div>
        <div class="prep-box" id="prepBox" hidden></div>
        <div class="pv-empty" id="pvEmpty">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="5" width="22" height="38" rx="5"/><path d="M21 20.5v7l6-3.5z" fill="currentColor"/></svg>
          <span id="lPvEmpty"></span>
        </div>
      </div>
      <div class="pv-meta" id="pvMeta"></div>
      <div class="transport">
        <div class="ruler" id="ruler"><canvas></canvas><i class="rhead"></i></div>
        <div class="timeline" id="timeline"><div class="played"></div><canvas id="wave"></canvas><div class="trim" id="trimBox"></div><div class="tl-hint" id="tlHint" hidden></div><div class="head"></div></div>
        <div class="zscroll" id="zscroll"><div class="mini"></div><div class="zthumb"><b class="h l"></b><b class="h r"></b></div></div>
        <div class="controls">
          <span class="tc tnum" id="tcNow">00:00:00:00</span>
          <div class="mid">
            <button class="ctl trim-btn" id="bIn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2.5H4v11h2.5"/><path d="M9 8h4M11 6l2 2-2 2"/></svg><span id="lIn"></span></button>
            <button class="ctl" title="←"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
            <button class="ctl skip" id="bPrevEdit"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2.6" y="3.2" width="1.7" height="9.6" rx=".6"/><path d="M13.2 3.6v8.8c0 .5-.5.7-.9.5L5.6 8.5a.6.6 0 0 1 0-1l6.7-4.4c.4-.2.9 0 .9.5z"/></svg></button>
            <button class="ctl play" id="bPlay"><svg viewBox="0 0 16 16" fill="currentColor" id="playIco"><path d="M4.5 2.6v10.8c0 .5.6.8 1 .5l8-5.4a.6.6 0 0 0 0-1l-8-5.4c-.4-.3-1 0-1 .5z"/></svg></button>
            <button class="ctl skip" id="bNextEdit"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="11.7" y="3.2" width="1.7" height="9.6" rx=".6"/><path d="M2.8 3.6v8.8c0 .5.5.7.9.5l6.7-4.4a.6.6 0 0 0 0-1L3.7 3.1c-.4-.2-.9 0-.9.5z"/></svg></button>
            <button class="ctl" title="→"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
            <button class="ctl trim-btn" id="bOut"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5H12v11H9.5"/><path d="M7 8H3M5 6L3 8l2 2"/></svg><span id="lOut"></span></button>
            <button class="ctl trim-btn" id="bCut"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="4.2" cy="11.8" r="2"/><circle cx="11.8" cy="11.8" r="2"/><path d="M5.6 10.4L12 2.5M10.4 10.4L4 2.5"/></svg><span id="lNewCut"></span></button>
            <button class="ctl trim-btn crop-btn" id="bCrop"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 1.5v10h10"/><path d="M1.5 4.5h10v10"/></svg><span id="lCrop"></span></button>
            <button class="open-cut" id="bOpenCut"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="4.2" cy="11.8" r="2"/><circle cx="11.8" cy="11.8" r="2"/><path d="M5.6 10.4L12 2.5M10.4 10.4L4 2.5"/></svg><span id="lOpenCut"></span></button>
          </div>
          <div class="pl-tools">
            <button class="pl-skip" id="bSkip" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.2" y="9.6" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="10.8" y="9.6" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><path d="M3.2 7.6C4 4 12 4 12.8 7.6"/><path d="M10.6 6.6l2.2 1 .6-2.3"/></svg><span id="lSkip"></span></button>
            <button class="pl-btn" id="bLoop"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 7.2V6.3a2.6 2.6 0 0 1 2.6-2.6h7.2"/><path d="M10.8 1.9l1.8 1.8-1.8 1.8"/><path d="M13.2 8.8v.9a2.6 2.6 0 0 1-2.6 2.6H3.4"/><path d="M5.2 14.1l-1.8-1.8 1.8-1.8"/></svg></button>
            <button class="pl-btn pl-q tnum" id="bQual" data-menu>Auto</button>
            <button class="pl-btn pl-rate tnum" id="bRate">1×</button>
            <button class="pl-btn pl-vol" id="bVol"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 6.1v3.8h2.5L8.2 12.6V3.4L4.9 6.1z" fill="currentColor" stroke="none"/><path class="w1" d="M10.4 6.1a2.7 2.7 0 0 1 0 3.8"/><path class="w2" d="M12.1 4.3a5.2 5.2 0 0 1 0 7.4"/><path class="mx" d="M10.6 6.2l3.4 3.6M14 6.2l-3.4 3.6"/></svg></button>
            <input type="range" class="vol-r" id="volR" min="0" max="100" step="1" value="100">
            <i class="meter" id="meter"><b></b><b></b></i>
          </div>
          <span class="tc end tnum" id="tcEnd">00:00:00:00</span>
        </div>
      </div>
    </section>

    <!-- INSPETOR -->
    <section class="card" id="inspector">
      <div class="card-head"><button class="fold-btn pf-main" id="bFoldPresets"><svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5L6 7l2.5-2.5"/></svg><svg class="fico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.6h4.5A1.5 1.5 0 0 1 14 6.1v5.4a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg><h2 id="lPresets"></h2><small id="pfMainCount"></small></button><button class="link" id="bManage"></button></div>
      <div class="fold" id="presetsFold"><div class="fold-in">
        <div class="presets" id="presets"></div>
      </div></div>
      <div class="presets pfolders" id="presetFolders"></div>
      <div class="preset-desc" id="presetDesc"></div>
      <div class="insp-title"><h3 id="inspFor"></h3><span class="modified" id="modified"><i></i><span id="lModified"></span></span><button class="link discard" id="bDiscard"></button><button class="link" id="bSavePreset"></button></div>
      <div class="inspector-body smooth" id="insp"><div class="sc" id="inspIn"></div></div>
      <div class="insp-foot">
        <div class="est" id="estBox"><small id="lEst"></small><b class="tnum" id="est"></b></div>
        <button class="btn small ghost" id="bApplyAll"></button>
      </div>
    </section>
  </div>

  <!-- janela "Escolher qualidade" da aba Baixar -->
  <div class="dk-modal-bg" id="dlPickBg" hidden><div class="dk-modal" id="dlPick" role="dialog"></div></div>
  <div class="dk-modal-bg" id="dlOptsBg" hidden><div class="dk-modal dk-opts-modal" role="dialog"><div class="dk-pk-head"><div><b id="lDlOptsT"></b></div><button class="dk-ib x" id="bDlOptsX"></button></div>
    <div class="dk-pk-body"><div class="dk-set" id="dlOptSet"></div><div class="dk-acc" id="dlAcc"></div></div></div></div>

  <!-- ABA BAIXAR -->
  <div class="dlv" id="dlView">
    <aside class="dk-side">
      <div class="dk-blk">
        <div class="dk-quick">
          <button class="dk-btn dk-pri" id="bDlVideo"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M9.2 1.6 3.4 9h4l-1 5.4L12.6 7h-4z"/></svg><span id="lDlVideo"></span><span class="dk-keys" id="kDlVideo"></span></button>
          <button class="dk-btn dk-sec dk-qa" id="bDlAudio"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12V3.5l7-1.5V10.5"/><circle cx="4.2" cy="12" r="1.8"/><circle cx="11.2" cy="10.5" r="1.8"/></svg><span id="lDlAudio"></span></button>
          <button class="dk-btn dk-sec dk-qa dk-qgif" id="bDlGif"><b>GIF</b></button>
        </div>
        <p class="dk-hint" id="lDlCap"></p>
        <button class="dk-btn dk-sec" id="bDlPick"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg><span id="lDlPick"></span></button>
        <p class="dk-hint" id="lDlPickSub"></p>
        <div class="dk-clip" id="dlClip"></div>
      </div>
      <div class="dk-blk dk-set" id="dlSet"></div>
      <div class="dk-foot"><button class="dk-opts" id="bDlOpts"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6" cy="4.5" r="1.4" fill="var(--side)"/><circle cx="10.5" cy="8" r="1.4" fill="var(--side)"/><circle cx="5" cy="11.5" r="1.4" fill="var(--side)"/></svg><span id="lDlOpts"></span></button><span id="dlFoot"></span></div>
    </aside>
    <section class="dk-list">
      <div class="dk-lhead"><div class="dk-tabs" id="dlTabs"></div><button class="link" id="bDlClear"></button>
        <button class="dk-ghost" id="bDlOpen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4.8A1.8 1.8 0 0 1 3.8 3h2.6l1.5 1.5h4.3A1.8 1.8 0 0 1 14 6.3v5A1.8 1.8 0 0 1 12.2 13H3.8A1.8 1.8 0 0 1 2 11.2z"/></svg><span id="lDlOpen"></span></button></div>
      <div class="dk-rows" id="dlRows"></div>
    </section>
  </div>

</div>

<!-- configurações -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog">
  <div class="sheet-head"><button class="sheet-back" id="bSheetBack" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button><h2 id="lSettings"></h2><button class="sheet-done" id="bDone"></button></div>
  <div class="sheet-body smooth" id="sheetScroll"><div class="sc" id="sheetBody"></div></div>
</div>

<!-- aba Cortar sem vídeo: abrir ou arrastar -->
<section class="cutter cut-blank" id="cutBlank" hidden><div class="dk-empty"><div>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="4.2" cy="11.8" r="2"/><circle cx="11.8" cy="11.8" r="2"/><path d="M5.6 10.4L12 2.5M10.4 10.4L4 2.5"/></svg>
  <b id="lCutBlankT"></b><span id="lCutBlankS"></span><button class="dk-btn dk-sec" id="bCutOpenFile"></button></div></div></section>

<!-- CORTADOR: página própria (a prévia e a linha do tempo vêm para cá) -->
<section class="cutter" id="cutter" hidden>
  <header class="cut-head">
    <div class="cut-title"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="4.2" cy="11.8" r="2"/><circle cx="11.8" cy="11.8" r="2"/><path d="M5.6 10.4L12 2.5M10.4 10.4L4 2.5"/></svg><h2 id="lCutter"></h2><b id="cutFile"></b><small id="cutInfo"></small></div>
    <div class="cut-actions"><span class="cut-saved" id="cutSaved" hidden></span><button class="btn small ghost" id="bCutCancel"></button><button class="btn small ghost" id="bCutDone"></button><button class="btn small cut-export" id="bCutExport"></button></div>
  </header>
  <div class="cut-body">
    <div class="cut-main"><div class="cut-stage" id="cutStageSlot"></div><div class="cut-transport" id="cutTransportSlot"></div></div>
    <aside class="cut-side">
      <div class="crop-card" id="cropCard" hidden></div>
      <div class="cut-side-head"><h3 id="lCuts"></h3><small id="cutTotal"></small><button class="link" id="bClearCuts"></button></div>
      <div class="cut-mode" id="cutMode" hidden><button data-v="split"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.5" y="4" width="5.5" height="8" rx="1.5"/><rect x="9" y="4" width="5.5" height="8" rx="1.5"/></svg><span id="lCutSplit"></span></button><button data-v="join"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.5" y="4" width="13" height="8" rx="1.5"/><path d="M8 4v8" stroke-dasharray="1.5 1.5"/></svg><span id="lCutJoin"></span></button></div>
      <div class="cut-list smooth" id="cutList"></div>
      <div class="cut-out" id="cutOut"></div>
      <div class="cut-keys" id="cutKeys"></div>
    </aside>
  </div>
</section>

<!-- novidades -->
<div class="sheet-bg news-bg" id="newsBg"></div>
<div class="sheet news" id="news" role="dialog" aria-labelledby="lNews">
  <div class="sheet-head"><h2 id="lNews"></h2><button class="sheet-done" id="bNewsDone"></button></div>
  <div class="sheet-body smooth" id="newsBody"></div>
</div>

<!-- desligar / suspender ao terminar -->
<div class="sheet-bg power-bg" id="powerBg"></div>
<div class="sheet power" id="power" role="alertdialog" aria-labelledby="powerTitle">
  <div class="power-in"><div class="power-ring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19"/><circle class="arc" cx="22" cy="22" r="19"/></svg><b id="powerN">60</b></div>
    <h2 id="powerTitle"></h2><p id="powerSub"></p>
    <div class="power-btns"><button class="btn" id="bPowerCancel"></button><button class="link" id="bPowerNow"></button></div></div>
</div>

<div class="menu" id="menu"></div>
<div class="drag-ghost" id="ghost"></div>
<div class="toast" id="toast"><i></i><span id="toastTxt"></span></div>
<audio id="sfxDone" src="sounds/done.mp3" preload="auto"></audio>

<div class="upd-card" id="updCard" hidden></div>
  <script src="i18n.js"></script>
  <script src="i18n-es.js"></script>
  <script src="i18n-fr.js"></script>
  <script src="i18n-de.js"></script>
  <script src="i18n-it.js"></script>
  <script src="i18n-ru.js"></script>
  <script src="i18n-ja.js"></script>
  <script src="i18n-ko.js"></script>
  <script src="i18n-zh.js"></script>
  <script src="i18n-dl.js"></script>
  <script src="i18n-gif.js"></script>
  <script src="i18n-view.js"></script>
<script src="news.js"></script>
<script src="demo.js"></script>
<script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
