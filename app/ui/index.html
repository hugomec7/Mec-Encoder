<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mec Encoder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- barra de título -->
  <div class="titlebar">
    <div class="drag" data-tauri-drag-region></div>
    <div class="lights">
      <button class="l-close" id="bClose" title="Fechar"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8" stroke="#4d0000" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button class="l-min" id="bMin" title="Minimizar"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="#5a3a00" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button class="l-max" id="bMax" title="Maximizar"><svg viewBox="0 0 10 10"><path d="M3 7V3h4M7 3L3 7" stroke="#003a00" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <div class="tb-title">
      <span class="logo"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M2.5 1.6v6.8L8.6 5z"/></svg></span>
      Mec Encoder
    </div>
    <button class="icon-btn theme-btn" id="bTheme" title="Tema claro / escuro">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="bSettings" title="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="main">

    <!-- FILA -->
    <section class="card" id="queueCard">
      <div class="card-head"><h2>Fila</h2><span class="count" id="qCount"></span><button class="link" id="bClearDone">Limpar concluídos</button></div>
      <div class="queue" id="queue"></div>
      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 14v4a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-4"/></svg>
        <div><b>Arraste vídeos para cá</b>ou clique para escolher. Entram com o preset selecionado.</div>
      </div>
      <div class="queue-foot">
        <div class="totals"><span id="tTotal"></span><span id="tEta"></span></div>
        <button class="btn" id="bRender"><i class="fillbar" id="renderFill"></i>
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.6v10.8c0 .5.6.8 1 .5l8.3-5.4a.6.6 0 0 0 0-1L5 2.1c-.4-.3-1 0-1 .5z"/></svg>
          <span id="renderTxt">Renderizar fila</span></button>
      </div>
    </section>

    <!-- PRÉVIA -->
    <section class="card preview">
      <div class="pv-top">
        <div class="chips" id="chips"></div>
        <div class="seg" id="pvSeg"><div class="pill"></div><button class="active" data-v="in">Original</button><button data-v="out">Resultado</button></div>
      </div>
      <div class="stage"><div class="frame" id="frame"></div></div>
      <div class="transport">
        <div class="timeline" id="timeline"><div class="played"></div><canvas id="wave"></canvas><div class="head"></div></div>
        <div class="controls">
          <span class="tc tnum" id="tcNow">00:00:41:12</span>
          <div class="mid">
            <button class="ctl" title="Quadro anterior (←)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
            <button class="ctl" title="Voltar 5 s"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M7.6 3.4v9.2L1.8 8zM14.2 3.4v9.2L8.4 8z"/></svg></button>
            <button class="ctl play" id="bPlay" title="Reproduzir (Espaço)"><svg viewBox="0 0 16 16" fill="currentColor" id="playIco"><path d="M4.5 2.6v10.8c0 .5.6.8 1 .5l8-5.4a.6.6 0 0 0 0-1l-8-5.4c-.4-.3-1 0-1 .5z"/></svg></button>
            <button class="ctl" title="Avançar 5 s"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.8 3.4v9.2L7.6 8zM8.4 3.4v9.2L14.2 8z"/></svg></button>
            <button class="ctl" title="Próximo quadro (→)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
          </div>
          <span class="tc end tnum" id="tcEnd">00:02:15:31</span>
        </div>
      </div>
    </section>

    <!-- INSPETOR -->
    <section class="card" id="inspector">
      <div class="card-head"><h2>Presets</h2><button class="link" id="bManage">Gerenciar</button></div>
      <div class="presets" id="presets"></div>
      <div class="preset-desc" id="presetDesc"></div>
      <div class="insp-title"><h3 id="inspFor">Ajustes</h3><span class="modified" id="modified"><i></i>Modificado</span><button class="link" id="bSavePreset">Salvar no preset</button></div>
      <div class="inspector-body" id="insp"></div>
      <div class="insp-foot">
        <div class="est"><small>Tamanho estimado</small><b class="tnum" id="est">≈ 831 MB</b></div>
        <button class="btn small ghost" id="bApplyAll">Aplicar a todos</button>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"><i></i><span id="toastTxt"></span></div>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
