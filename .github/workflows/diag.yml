name: Diag HDR preview chain
on:
  push:
    branches: [player]
    paths: [".github/workflows/diag.yml"]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - name: FFmpeg + chains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ff && gh release download latest -R BtbN/FFmpeg-Builds -p "*n8.0-latest-win64-gpl-shared-8.0.zip" -D ff
          cd ff && 7z x -y *.zip > /dev/null && cd ..
          F=$(find ff -name ffmpeg.exe | head -1); $F -hide_banner -version | head -1
          $F -v error -y -f lavfi -i "testsrc2=s=1920x1080:r=60000/1001,format=yuv420p10le" -t 2 -c:v libx265 -preset ultrafast -x265-params "keyint=60:log-level=error" -color_primaries bt2020 -color_trc arib-std-b67 -colorspace bt2020nc -tag:v hvc1 a.mov
          $F -v error -y -f lavfi -i "testsrc2=s=1920x1080:r=60000/1001,format=yuv420p10le" -t 2 -c:v libx265 -preset ultrafast -x265-params "keyint=60:log-level=error:colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc:range=limited" -color_primaries bt2020 -color_trc arib-std-b67 -colorspace bt2020nc -color_range tv -tag:v hvc1 b.mov
          Z="zscale=tin=arib-std-b67:pin=bt2020:min=bt2020nc:rin=tv:t=linear:npl=100,format=gbrpf32le,tonemap=tonemap=hable:desat=0:peak=10,zscale=p=bt709:t=bt709:m=bt709:r=tv"
          S="scale=w=640:h=640:force_original_aspect_ratio=decrease:flags=bilinear"
          for f in a.mov b.mov; do
            $F -hide_banner -v error -i $f -show_entries 2>/dev/null; ./ff/*/bin/ffprobe.exe -v error -show_entries stream=color_range,color_space,color_transfer,color_primaries,chroma_location,pix_fmt -of compact $f
            for vf in "$Z" "$S,$Z" "$S,$Z,setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709:range=tv" "$S,format=yuv420p10le,$Z" "$S:out_range=tv,$Z" "scale=640:-2:flags=bilinear:threads=0,format=yuv420p10le,$Z" "$S,setparams=range=tv:color_primaries=bt2020:color_trc=arib-std-b67:colorspace=bt2020nc,$Z" "$S,zscale=rin=tv:r=tv,$Z"; do
              echo "== $f | $vf"
              $F -hide_banner -v error -ss 0.5 -i $f -frames:v 1 -vf "$vf,format=rgba" -f rawvideo - 2>&1 >/dev/null | head -3; echo "exit=${PIPESTATUS[0]}"
            done
          done
