name: Diag mecview HDR
on:
  push:
    branches: [player]
    paths: [".github/workflows/diag.yml"]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev
          nproc; ffmpeg -version | head -1
          gcc -O2 app/viewer/mecview.c $(pkg-config --cflags --libs libavformat libavcodec libavfilter libavutil) -o mecview
          cat > d.py <<'PY'
          import subprocess
          f='hdr.mov'
          subprocess.run(['ffmpeg','-v','error','-y','-f','lavfi','-i','testsrc2=s=1920x1080:r=60000/1001,format=yuv420p10le','-t','2','-c:v','libx265','-preset','ultrafast','-x265-params','keyint=60:log-level=error:colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc:range=limited','-color_range','tv','-color_primaries','bt2020','-color_trc','arib-std-b67','-colorspace','bt2020nc','-tag:v','hvc1',f],check=True)
          Z='zscale=tin=arib-std-b67:pin=bt2020:min=bt2020nc:rin=tv:t=linear:npl=100,format=gbrpf32le,tonemap=tonemap=hable:desat=0:peak=10,zscale=p=bt709:t=bt709:m=bt709:r=tv'
          S='scale=w=640:h=640:force_original_aspect_ratio=decrease:flags=bilinear'
          def mv(vf):
              p=subprocess.Popen(['./mecview'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
              p.stdin.write(f'open 1 0 {f}\nframe 1 0.5005 {vf}\nquit\n'.encode()); p.stdin.flush()
              p.stdout.readline(); h=p.stdout.readline().decode(); return p.stdout.read(int(h.split()[3]))
          def cli(vf,extra=[]):
              return subprocess.run(['ffmpeg','-v','error']+extra+['-ss','0.5005','-i',f,'-frames:v','1','-vf',vf+',format=rgba','-f','rawvideo','-'],capture_output=True).stdout
          def d(a,b): return sum(abs(x-y) for x,y in zip(a[::7],b[::7]))/len(a[::7]) if len(a)==len(b) else -1
          for name,vf in [('S+Z',S+','+Z),('S',S),('Z only',Z),('S+Z+fmt709',S+','+Z+',format=yuv420p'),('S+Z+setparams',S+','+Z+',setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709:range=tv')]:
              a=mv(vf)
              for ex in [[],['-threads','1'],['-filter_threads','1'],['-threads','1','-filter_threads','1']]:
                  print(name, ex, 'diff', round(d(a,cli(vf,ex)),3))
              # two mecview runs
              print(name,'mecview vs mecview', round(d(a,mv(vf)),3))
              print(name,'pixel0 mv',list(a[4000:4008]),'cli',list(cli(vf)[4000:4008]))
          PY
          python3 d.py
